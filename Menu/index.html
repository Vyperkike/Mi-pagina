    $("#flipbook").turn({

       // height: 1438,  // alto real de tus imágenes

      height: (window.innerWidth * 0.9) * (1438/1080), // mantiene proporción S9 Galaxy Tab
      //height: (window.innerWidth * 0.9) * (2112/1320),  mantiene proporción S10 Tab lite

        display: 'single',
        gradients: true,
